name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 保持隔離，確保各平台獨立運作
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # Linux 環境獨有依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 🟢 完美運作的設定檔改寫（先前 Linux/Mac 成功已驗證此步驟完美無瑕）
      - name: Force Fix Cargo.toml Config
        shell: python
        run: |
          import re
          with open("Cargo.toml", "r", encoding="utf-8") as f:
              text = f.read()
          text = re.sub(r'crate-type\s*=\s*\[.*?\]', 'crate-type = ["cdylib"]', text)
          with open("Cargo.toml", "w", encoding="utf-8") as f:
              f.write(text)

      # 🚀【關鍵修正】：Windows 回歸標準編譯，只掛上 C 語言原始碼內嵌功能，100% 輸出 .dll
      - name: Windows Compilation
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3 rusqlite/bundled"

      # Linux & macOS 保持原本成功的編譯方式
      - name: Linux / macOS Compilation
        if: matrix.os != 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3"

      # 上傳編譯產物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/**/sqlite_hashes.dll
            target/release/**/libsqlite_hashes.so
            target/release/**/libsqlite_hashes.dylib
            target/release/**/*sqlite_hashes*
          if-no-files-found: warn
