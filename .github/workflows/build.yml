name: Build SQLite Hashes Extension

on:
  workflow_dispatch: # 手動點擊觸發

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 🚀 修正核心：不再手動改動 Cargo.toml 與 RUSTFLAGS。
      # 使用官方提供的 "default_loadable_extension" 旗標，
      # 這會自動讓 Windows、Linux、macOS 產出正確的動態連結庫與進入點！
      - name: Run Cargo Build with Blake3 and Loadable Extension Flags
        run: cargo build --release --features "default_loadable_extension blake3"

      # 🔥 終極優化上傳：使用雙星號 (**) 進行全目錄遞迴搜尋，確保抓到任何延伸檔名的二進位庫，上傳編譯產物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/**/sqlite_hashes.dll
            target/release/**/libsqlite_hashes.so
            target/release/**/libsqlite_hashes.dylib
            target/release/**/*sqlite_hashes*
          if-no-files-found: error
