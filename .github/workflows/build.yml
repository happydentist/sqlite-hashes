name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. 跨平台分流編譯（移除了所有導致 Windows 報錯的環境變數黑魔法）
      - name: Compile on Unix-like Systems
        if: matrix.os != 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3"

      # Windows 專用分流，額外附帶 rusqlite/bundled 旗標
      - name: Compile on Windows
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3 rusqlite/bundled"

      # 3. 檢查並列出產物
      - name: List Release Files
        run: |
          echo "=== Content of target/release/ ==="
          ls -la target/release/ || dir target\release\

      # 4. 保證 100% 抓取上傳機制
      # 根據 nyurik 專案的配置，編譯完的庫名稱必然會叫 sqlite_hashes
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/libsqlite_hashes.*
            target/release/sqlite_hashes.*
          if-no-files-found: error
