name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. 跨平台獨立分流編譯（徹底拆開，絕不讓 Windows 執行到 Linux 的 Shell 指令）
      - name: Compile on Linux / macOS
        if: matrix.os != 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3"

      # Windows 平台：使用專屬的 bundled 旗標，在無 sqlite3 環境下強制本地自動編譯
      - name: Compile on Windows
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3 rusqlite/bundled"

      # 3. 防呆上傳機制（將 target/release/ 根目錄的所有動態連結庫上傳）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/libsqlite_hashes.*
            target/release/sqlite_hashes.*
          if-no-files-found: error
