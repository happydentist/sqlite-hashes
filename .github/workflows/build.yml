name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            features: "loadable_extension blake3"
          - os: macos-latest
            platform: macos
            features: "loadable_extension blake3"
          - os: windows-latest
            platform: windows
            # Windows 環境必須加上 rusqlite/bundled 進行本地 C 庫混合編譯
            features: "loadable_extension blake3 rusqlite/bundled"
            
    defaults:
      run:
        # 🔥 最關鍵的核心：強制所有平台（包含 Windows）在編譯時統一使用 bash 核心
        # 這樣就能徹底擺脫 Windows PowerShell 對於引號、多 Feature 與環境變數的解析地獄！
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. 跨平台完全一致編譯
      # 透過引進 --crate-type=cdylib 強制 Rust 拋棄 rlib，在 Windows 上也必定吐出動態庫！
      - name: Run Cargo Build
        run: |
          cargo rustc --release --features "${{ matrix.features }}" -- --crate-type=cdylib

      # 3. 萬用字元防呆上傳機制
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/libsqlite_hashes.*
            target/release/sqlite_hashes.*
          if-no-files-found: error
