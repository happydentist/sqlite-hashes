name: Build SQLite Hashes Extension

on:
  workflow_dispatch: # 手動點擊觸發

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 🔥 關鍵修正：強迫 Windows 將輸出型態指定為 cdylib，這樣才會產出 .dll
      - name: Force Dynamic Library (cdylib) Configuration
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # 使用 sed 在 [lib] 下方插入 crate-type = ["cdylib"]
            sed -i '/\[lib\]/a crate-type = ["cdylib"]' Cargo.toml
            echo "Cargo.toml has been modified for Windows DLL generation."
          fi

      - name: Run Cargo Build with Blake3 Optimizations
        run: cargo build --release --features "loadable_extension blake3"

      # 上傳編譯產物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.so
            target/release/*.dylib
            target/release/*.dll
          if-no-files-found: error
