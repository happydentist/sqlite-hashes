name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output_name: libsqlite_hashes.so
          - os: macos-latest
            platform: macos
            output_name: libsqlite_hashes.dylib
          - os: windows-latest
            platform: windows
            output_name: sqlite_hashes.dll

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # 1. 既然標準編譯只給 rlib，那我們先用 cargo 幫我們把所有底層依賴套件（如 blake3、digest）下載並編譯好
      - name: Fetch and Prepare Dependencies
        run: cargo check --release --features "loadable_extension blake3"

      # 2. 🔥【核心大絕招】：繞過 Cargo 的限制，直接用 rustc 將主程式 src/lib.rs 編譯成我們要的平台動態庫
      - name: Force Compile to Dynamic Library
        run: |
          rustc --crate-name sqlite_hashes src/lib.rs --crate-type=cdylib --release --cfg 'feature="loadable_extension"' --cfg 'feature="blake3"' -L target/release/deps -o ${{ matrix.output_name }}

      # 3. 檢查檔案是否存在（Debug 用）
      - name: Check output file
        run: |
          ls -la ${{ matrix.output_name }} || dir ${{ matrix.output_name }}

      # 4. 檔案就在根目錄，百分之百不可能抓不到
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: ${{ matrix.output_name }}
          if-no-files-found: error
