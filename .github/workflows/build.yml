name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4
      
      # 1. 安裝 Rust 環境
      - uses: dtolnay/rust-toolchain@stable

      # 2. 安裝官方推薦的自動化編譯工具 `just`
      - name: Install Just Runner
        uses: taiki-e/install-action@just

      # 3. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 4. 透過專案內建的 `justfile` 進行全自動、無干擾的編譯
      # 這樣一來會完全走專案作者預設的安全路徑，絕不會觸發 101 與 1 錯誤
      - name: Build Loadable Extension via Just
        run: just build

      # 5. 防呆搜刮上傳機制
      # 官方 just 腳本會在 target/release/ 產出正確的動態連結庫
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/libsqlite_hashes.*
            target/release/sqlite_hashes.*
          if-no-files-found: error
