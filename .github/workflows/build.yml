name: Build SQLite Hashes Extension

on:
  workflow_dispatch: # 手動點擊觸發

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 🔥 核心修正 1：用最暴力的方式，不管它原本怎麼寫，直接複寫 Cargo.toml 
      # 強迫宣告 [lib] 的 crate-type 必須包含 "cdylib"，這樣 Windows 就一定會生出 .dll
      - name: Overwrite Cargo.toml Lib Configuration
        shell: bash
        run: |
          echo -e '\n[lib]\nname = "sqlite_hashes"\ncrate-type = ["cdylib", "rlib"]' >> Cargo.toml
          cat Cargo.toml # 輸出檢查，確保寫入成功

      # 🔥 核心修正 2：在編譯前強制執行 cargo clean，把以前殘留的 rlib 快取全部洗掉
      - name: Clean Previous Cache
        run: cargo clean

      # 使用官方標準的 loadable_extension 與 blake3 進行編譯
      - name: Run Cargo Build with Blake3 Optimizations
        run: cargo build --release --features "loadable_extension blake3"

      # 🔥 終極優化上傳：使用雙星號 (**) 進行全目錄遞迴搜尋，確保抓到任何延伸檔名的二進位庫，上傳編譯產物（改用最安全的全域遞迴搜尋）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/**/sqlite_hashes.dll
            target/release/**/libsqlite_hashes.so
            target/release/**/libsqlite_hashes.dylib
            target/release/**/*sqlite_hashes*
          if-no-files-found: error
