name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. 跨平台分流編譯
      - name: Compile on Unix-like Systems
        if: matrix.os != 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3"

      - name: Compile on Windows
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3 rusqlite/bundled"

      # 3. 列出產物檔案 (Debug 專用，可在 Log 中直接看到實際產出的檔名)
      - name: List Release Files
        run: |
          echo "=== Content of target/release/ ==="
          ls -la target/release/ || dir target\release\

      # 4. 保證防呆的上傳機制
      # 我們利用多行 path，並搭配驚嘆號「!」來精確排除 deps 目錄。
      # 這樣無論檔名是 sqlite_hashes 還是 sqlite-hashes，都能100%成功上傳！
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            !target/release/deps/**
          if-no-files-found: error
