name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            features: "loadable_extension,blake3"
          - os: macos-latest
            platform: macos
            features: "loadable_extension,blake3"
          - os: windows-latest
            platform: windows
            # Windows 環境必須加上 rusqlite/bundled 讓它現場編譯 C 庫
            features: "loadable_extension,blake3,rusqlite/bundled"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. 跨平台通用編譯
      # 💡 核心修正：
      #   a. 加上 `--lib` 參數，強制 Cargo 繞過 dev-dependencies（徹底消滅 cargo-husky 導致的 101 崩潰）
      #   b. 移除命令列最後方的 `-- --crate-type` 覆寫，因為專案 Cargo.toml 本身就已經內建配置好了 cdylib 特性！
      - name: Run Cargo Build
        run: cargo build --release --lib --features "${{ matrix.features }}"

      # 3. 防呆上傳機制
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/libsqlite_hashes.*
            target/release/sqlite_hashes.*
          if-no-files-found: error
