name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 平台相互隔離，其餘平台即便失敗，Windows 也會繼續執行完畢
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. 🔥【三大 OS 分流編譯核心】
      # 我們不在根目錄瞎攪和，而是用官方推薦的 --crate-type 引數
      # 同時在 Windows 上外掛 `rusqlite/bundled` 以防 C 語言庫缺失！
      
      - name: Compile on Linux
        if: matrix.os == 'ubuntu-latest'
        run: cargo rustc --release --features "loadable_extension blake3" -- --crate-type=cdylib

      - name: Compile on macOS
        if: matrix.os == 'macos-latest'
        run: cargo rustc --release --features "loadable_extension blake3" -- --crate-type=cdylib

      - name: Compile on Windows
        if: matrix.os == 'windows-latest'
        run: cargo rustc --release --features "loadable_extension blake3 rusqlite/bundled" -- --crate-type=cdylib

      # 3. 🔥【極限暴力搜尋上傳】
      # 經過查證，Windows 在用 cdylib 編譯時會自動把產物命名為 `sqlite_hashes.dll`
      # 為了防呆，我們直接搜刮整個 `target/release/` 內的所有動態連結庫檔案！
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/deps/*.dll
            target/release/deps/*.so
            target/release/deps/*.dylib
          if-no-files-found: error
