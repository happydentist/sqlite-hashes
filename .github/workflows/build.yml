name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            features: loadable_extension,blake3
          - os: macos-latest
            platform: macos
            features: loadable_extension,blake3
          - os: windows-latest
            platform: windows
            # 用逗號分隔，這是 Cargo 官方支援最不易出錯的格式
            features: loadable_extension,blake3,rusqlite/bundled
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      # 本地依賴在 Linux 是必備的，Windows 有 bundled 故不需要
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. 跨平台通用編譯
      # 透過封裝內建的環境變數，完美繞過 Windows Shell 對於命令列引號的解析地獄！
      - name: Run Cargo Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true" # 順便幫產物瘦身
        run: cargo build --release --features "${{ matrix.features }}"

      # 3. 列出產物檔案 (Debug 確保產物格式)
      - name: List Release Files
        run: |
          echo "=== Content of target/release/ ==="
          ls -la target/release/ || dir target\release\

      # 4. 精確抓取上傳
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/libsqlite_hashes.*
            target/release/sqlite_hashes.*
          if-no-files-found: error
