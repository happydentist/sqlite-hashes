name: Build SQLite Hashes Extension

on:
  workflow_dispatch: # 手動點擊觸發
 
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 關鍵修正：直接修改 Cargo.toml 內容
      - name: Hardcode Cargo.toml crate-type to cdylib
        shell: python
        run: |
          import re
          with open("Cargo.toml", "r", encoding="utf-8") as f: text = f.read()
          text = re.sub(r'crate-type\s*=\s*\[.*?\]', 'crate-type = ["cdylib"]', text)
          with open("Cargo.toml", "w", encoding="utf-8") as f: f.write(text)
      # 使用 cargo rustc 強制產出 cdylib
      - name: Build with cdylib
        run: cargo rustc --release --features "loadable_extension blake3 rusqlite/bundled" -- --crate-type=cdylib
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: target/release/**/*sqlite_hashes*
          if-no-files-found: error
