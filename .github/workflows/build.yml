name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. Linux / macOS 編譯步驟
      - name: Compile on Linux / macOS
        if: matrix.os != 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3"

      # 3. Windows 編譯步驟（修正引號轉義，確保 Windows 順利讀取多個 features）
      # 使用 單引號 包裹 雙引號，防範 Windows 預設 Shell 解析字串時破壞特徵旗標
      - name: Compile on Windows
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features '"loadable_extension blake3 rusqlite/bundled"'

      # 4. 防呆上傳機制
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
            target/release/libsqlite_hashes.*
            target/release/sqlite_hashes.*
          if-no-files-found: error
