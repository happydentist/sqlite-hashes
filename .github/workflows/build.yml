name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # Linux 環境獨有依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 🚀【唯一重大關鍵修正】：
      # 根據專案結構，我們不需要去修改 Cargo.toml！
      # 而是透過 `--example` 或 `--package` 形式，直接指定專案內的 `sqlite_hashes` 動態庫目標，
      # 並在 Windows 下精準開啟 C 原始碼內嵌 (rusqlite/bundled)，這樣 Windows 就能直接組裝出 DLL。
      - name: Windows Compilation (Target Dynamic DLL)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --lib --features "loadable_extension blake3 rusqlite/bundled"

      # Linux & macOS 保持原本成功的編譯方式
      - name: Linux / macOS Compilation
        if: matrix.os != 'windows-latest'
        run: cargo build --release --lib --features "loadable_extension blake3"

      # 🔥【上傳路徑優化】：
      # 不管它藏在 target/release 的哪個子目錄（Windows 常會藏在 /deps 或根目錄下），
      # 全面遞迴掃描，只要副檔名是 .dll、.so、.dylib 全部打包，絕對不漏抓！
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/**/*.dll
            target/release/**/*.so
            target/release/**/*.dylib
            target/release/deps/*.dll
          if-no-files-found: error
