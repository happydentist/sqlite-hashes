name: Build SQLite Hashes Extension

on:
  workflow_dispatch: # 讓您可以手動點擊按鈕來觸發編譯

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Run Cargo Build with Blake3 Optimizations
        run: cargo build --release --features "loadable_extension blake3"

      # 新增防呆：在雲端列出編譯出來的實際檔案，方便排查
      - name: List build artifacts (Debug)
        if: matrix.os != 'windows-latest'
        run: ls -R target/release/
        
      - name: List build artifacts Windows (Debug)
        if: matrix.os == 'windows-latest'
        run: dir target\release\

      # 優化後的上傳：使用萬用字元 (*)，不管副檔名或前綴，只要在 release 目錄下就打包
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: |
            target/release/*sqlite_hashes*
          if-no-files-found: error # 如果找不到檔案，直接報錯，不默默跳過
