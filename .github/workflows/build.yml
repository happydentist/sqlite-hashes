name: Build SQLite Hashes Extension
on: [workflow_dispatch] 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: libsqlite_hashes.so
          - os: macos-latest
            platform: macos
            artifact_name: libsqlite_hashes.dylib
          - os: windows-latest
            platform: windows
            artifact_name: sqlite_hashes.dll
            
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      # 1. 解決 Linux 環境依賴
      - name: Install SQLite Dev Libraries (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # 2. 跨平台分流編譯
      # 回歸標準的 cargo build，讓專案讀取自身的 Cargo.toml 設定
      - name: Compile on Unix-like Systems
        if: matrix.os != 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3"

      - name: Compile on Windows
        if: matrix.os == 'windows-latest'
        run: cargo build --release --features "loadable_extension blake3 rusqlite/bundled"

      # 3. 精確上傳產物
      # 標準編譯後，產物必然會以正確的下底線「_」命名，並乖乖出現在 target/release/ 根目錄下！
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-hashes-${{ matrix.platform }}
          path: target/release/${{ matrix.artifact_name }}
          if-no-files-found: error
